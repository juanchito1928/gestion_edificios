<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VecinosApp - Gestión de Edificios</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Menú de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">VecinosApp</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
    {% if user.is_authenticated %}
        <li class="nav-item me-3 text-white">
            Hola, <b>{{ user.username }}</b>
        </li>
        <li class="nav-item">
            <!-- Formulario necesario en Django 5 para el Logout por seguridad -->
            <form action="{% url 'logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm me-2">Salir</button>
            </form>
        </li>
    {% else %}
        <li class="nav-item me-2">
            <a class="btn btn-outline-light btn-sm" href="{% url 'incidencias:registro' %}">Registrarse</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" href="{% url 'login' %}">Iniciar Sesión</a>
        </li>
    {% endif %}
    
    <li class="nav-item">
        <a class="nav-link text-white" href="/admin/" target="_blank">Panel Admin</a>
    </li>
</ul>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/admin/" target="_blank">Panel Admin</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal donde se inyectarán las otras páginas -->
    <div class="container">
        {% block content %}
        <!-- El contenido de las otras páginas aparecerá aquí -->
        {% endblock %}
    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
