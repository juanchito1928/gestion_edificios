{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Reportar Nueva Incidencia</h4>
        </div>
        <div class="card-body">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="titulo" class="form-label font-weight-bold">Título</label>
                    <input type="text" name="titulo" id="titulo" class="form-control" required placeholder="Ej: Fuga de agua en el baño">
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label font-weight-bold">Descripción</label>
                    <textarea name="descripcion" id="descripcion" class="form-control" rows="4" required placeholder="Describe el detalle del problema..."></textarea>
                </div>

                <div class="mb-3">
                    <label for="unidad" class="form-label font-weight-bold">Unidad / Apartamento</label>
                    <select name="unidad" id="unidad" class="form-select" required>
                        <option value="">-- Selecciona una unidad --</option>
                        {% for unidad in unidades %}
                            <option value="{{ unidad.id }}">{{ unidad }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="foto" class="form-label font-weight-bold">Foto / Evidencia (Opcional)</label>
                    <input type="file" name="foto" id="foto" class="form-control" accept="image/*">
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'incidencias:lista_incidencias' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Reporte</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
